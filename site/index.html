<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>冒泡排序实验室</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #eff6ff; background: #071321; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 15% 15%, #144174 0, transparent 28rem), radial-gradient(circle at 85% 5%, #2a245d 0, transparent 30rem), #071321; }
      main { width: min(920px, calc(100% - 40px)); margin: 0 auto; padding: 72px 0 48px; }
      .tag { display: inline-block; padding: 6px 10px; border: 1px solid #5eead4aa; border-radius: 999px; color: #99f6e4; font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      h1 { max-width: 700px; margin: 18px 0 12px; font-size: clamp(2.6rem, 8vw, 5.6rem); line-height: .98; letter-spacing: -.065em; }
      .intro { max-width: 620px; color: #bdd1e8; font-size: 1.13rem; line-height: 1.7; }
      .panel { margin-top: 42px; padding: clamp(20px, 4vw, 36px); border: 1px solid #ffffff1c; border-radius: 24px; background: #0c1b2ddd; box-shadow: 0 24px 80px #0006; backdrop-filter: blur(12px); }
      .label { display: block; margin-bottom: 9px; color: #cbd5e1; font-size: .88rem; font-weight: 700; }
      .controls { display: flex; gap: 12px; flex-wrap: wrap; }
      input { flex: 1 1 360px; min-width: 0; padding: 13px 15px; border: 1px solid #3f5e7b; border-radius: 12px; outline: none; background: #091726; color: #f8fafc; font: inherit; }
      input:focus { border-color: #5eead4; box-shadow: 0 0 0 3px #5eead422; }
      button { border: 0; border-radius: 12px; padding: 13px 18px; cursor: pointer; background: #5eead4; color: #052e2b; font: inherit; font-weight: 800; transition: transform .16s, filter .16s; }
      button:hover { filter: brightness(1.08); transform: translateY(-1px); }
      button.secondary { border: 1px solid #426483; background: transparent; color: #dbeafe; }
      .message { min-height: 24px; margin: 16px 0 8px; color: #8fb5d9; font-size: .92rem; }
      .bars { display: flex; align-items: end; gap: clamp(5px, 1vw, 10px); height: 240px; padding: 18px 4px 0; border-bottom: 1px solid #31516d; }
      .bar-wrap { display: grid; flex: 1; min-width: 0; height: 100%; grid-template-rows: 1fr auto; gap: 8px; align-items: end; }
      .bar { min-height: 18px; border-radius: 9px 9px 3px 3px; background: linear-gradient(180deg, #60a5fa, #2563eb); transition: height .36s ease, background .2s ease, transform .2s ease; }
      .bar.active { background: linear-gradient(180deg, #fde68a, #f59e0b); transform: scaleX(1.06); }
      .bar.done { background: linear-gradient(180deg, #99f6e4, #14b8a6); }
      .value { text-align: center; color: #bcd0e6; font-size: .82rem; font-variant-numeric: tabular-nums; }
      .footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 34px; color: #91a9c2; font-size: .92rem; }
      a { color: #99f6e4; }
      @media (max-width: 560px) { main { width: min(100% - 28px, 920px); padding-top: 48px; } .controls button { flex: 1; } .bars { height: 180px; } .footer { display: block; } }
    </style>
  </head>
  <body>
    <main>
      <span class="tag">Python algorithm demo</span>
      <h1>看见排序<br>正在发生。</h1>
      <p class="intro">输入一组整数，观察冒泡排序如何逐轮比较、交换，并把最大值移动到末尾。</p>

      <section class="panel" aria-labelledby="demo-title">
        <label class="label" id="demo-title" for="numbers">输入数字（用逗号或空格分隔）</label>
        <div class="controls">
          <input id="numbers" value="5, 3, 8, 4, 2" inputmode="numeric" aria-describedby="message">
          <button id="sort" type="button">开始排序</button>
          <button id="reset" class="secondary" type="button">重置示例</button>
        </div>
        <p class="message" id="message" role="status">准备就绪。</p>
        <div class="bars" id="bars" aria-label="数字排序可视化"></div>
      </section>

      <footer class="footer">
        <span>提前退出优化：一轮没有交换时，排序立即结束。</span>
        <a href="https://github.com/rui-fen/vscodetest">查看源代码</a>
      </footer>
    </main>
    <script>
      const input = document.querySelector('#numbers');
      const bars = document.querySelector('#bars');
      const message = document.querySelector('#message');
      const sortButton = document.querySelector('#sort');
      let values = [];

      function parseValues() {
        const items = input.value.trim().split(/[，,\s]+/).filter(Boolean).map(Number);
        if (!items.length || items.some(item => !Number.isFinite(item))) throw new Error('请输入至少一个有效数字。');
        return items;
      }

      function render(active = [], completedFrom = values.length) {
        const max = Math.max(...values.map(Math.abs), 1);
        bars.innerHTML = values.map((value, index) => {
          const height = Math.max(12, Math.abs(value) / max * 100);
          const classes = ['bar', active.includes(index) ? 'active' : '', index >= completedFrom ? 'done' : ''].join(' ');
          return `<div class="bar-wrap"><div class="${classes}" style="height:${height}%"></div><span class="value">${value}</span></div>`;
        }).join('');
      }

      const pause = ms => new Promise(resolve => setTimeout(resolve, ms));

      async function sort() {
        try { values = parseValues(); } catch (error) { message.textContent = error.message; return; }
        sortButton.disabled = true;
        sortButton.textContent = '排序中…';
        let comparisons = 0;
        for (let end = values.length - 1; end > 0; end--) {
          let swapped = false;
          for (let index = 0; index < end; index++) {
            comparisons++;
            render([index, index + 1], end + 1);
            message.textContent = `第 ${comparisons} 次比较：${values[index]} 与 ${values[index + 1]}`;
            await pause(420);
            if (values[index] > values[index + 1]) {
              [values[index], values[index + 1]] = [values[index + 1], values[index]];
              swapped = true;
              render([index, index + 1], end + 1);
              await pause(220);
            }
          }
          if (!swapped) break;
        }
        render([], 0);
        message.textContent = `排序完成：${comparisons} 次比较，结果为 [${values.join(', ')}]。`;
        sortButton.disabled = false;
        sortButton.textContent = '开始排序';
      }

      document.querySelector('#sort').addEventListener('click', sort);
      document.querySelector('#reset').addEventListener('click', () => { input.value = '5, 3, 8, 4, 2'; values = parseValues(); render(); message.textContent = '已重置示例。'; });
      values = parseValues();
      render();
    </script>
  </body>
</html>
