name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install quality tools
        run: python -m pip install --upgrade pip ruff coverage

      - name: Lint
        run: ruff check .

      - name: Check syntax
        run: python -m py_compile bubble_sort.py test_bubble_sort.py

      - name: Run unit tests with coverage
        run: coverage run -m unittest discover -v

      - name: Report coverage
        run: coverage report --show-missing

      - name: Generate coverage report
        run: coverage xml -o coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency auditor
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit installed dependencies
        run: pip-audit --strict
